name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Випустити реліз цієї версії (без «v», напр. 0.10.3); порожньо — лише збірка"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no gradle-wrapper.jar, so Gradle comes from the action.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "Using persistent signing key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret not set, APK is signed with a throwaway debug key"
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="PowerHub-${version}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerHub-apk
          path: ${{ steps.apk.outputs.file }}

      # Every push to main refreshes the "dev" pre-release with the newest APK.
      - name: Publish dev build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "${{ steps.apk.outputs.file }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Dev build (${GITHUB_SHA::7})" \
            --notes "Автоматична збірка з останнього коміту в main. Може бути нестабільною."

      # Tags like v0.2 become regular releases. A manual run with a version does the same and
      # creates the tag itself (tags can't be pushed from every environment).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            actual=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            if [ "$actual" != "$INPUT_VERSION" ]; then
              echo "::error::versionName is $actual, not $INPUT_VERSION"
              exit 1
            fi
            tag="v$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          gh release create "$tag" "${{ steps.apk.outputs.file }}" \
            --target "$GITHUB_SHA" --title "PowerHub $tag" --generate-notes
